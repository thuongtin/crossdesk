name: Đề xuất tính năng / Feature request
description: Đề xuất tính năng mới hoặc cải tiến CrossDesk. Suggest a new feature or improvement for CrossDesk.
title: "[Feature] "
labels: [enhancement]
assignees: [kunkundi]
body:
  - type: markdown
    attributes:
      value: |
        Chỉ cần mô tả đề xuất của bạn, các mục khác tùy chọn. Bạn có thể dùng tiếng Việt hoặc tiếng Anh.
        Only a description of your idea is required. Vietnamese or English is welcome.

  - type: textarea
    id: proposal
    attributes:
      label: Đề xuất của bạn / Your idea
      description: Bạn muốn thêm hoặc cải tiến gì? Nếu tiện, mô tả tình huống sử dụng. What would you like to add or improve? If possible, describe when you would use it.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Thông tin bổ sung (tùy chọn) / Additional context (optional)
      description: Có thể thêm ảnh chụp, liên kết tham khảo hoặc giải thích khác. Add screenshots, links, or any other details.
    validations:
      required: false
