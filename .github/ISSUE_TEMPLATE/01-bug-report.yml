name: Báo lỗi / Bug report
description: Báo lỗi hoặc hành vi bất thường của CrossDesk. Report a bug or unexpected behavior in CrossDesk.
title: "[Bug] "
labels: [bug]
assignees: [kunkundi]
body:
  - type: markdown
    attributes:
      value: |
        Chỉ cần mô tả vấn đề, các mục khác tùy chọn. Bạn có thể dùng tiếng Việt hoặc tiếng Anh.
        Only a problem description is required. Vietnamese or English is welcome.

  - type: textarea
    id: problem
    attributes:
      label: Mô tả vấn đề / Problem description
      description: Bạn gặp vấn đề gì? Nếu tiện, nêu thao tác gây lỗi hoặc thông báo lỗi. What went wrong? If possible, include what you were doing or any error message.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Môi trường (tùy chọn) / Environment (optional)
      description: Hệ điều hành và phiên bản CrossDesk; lỗi kết nối có thể ghi cả hai thiết bị. OS and CrossDesk version; include both devices for connection issues.
      placeholder: Windows 11 → macOS 15; CrossDesk x.y.z
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: Ảnh chụp hoặc nhật ký (tùy chọn) / Screenshots or logs (optional)
      description: |
        Có thể kéo thả ảnh chụp, ghi màn hình hoặc tệp nhật ký; hãy che mật khẩu và thông tin nhạy cảm khác.
        Drag in screenshots, recordings, or logs. Hide passwords and other sensitive information.
    validations:
      required: false
